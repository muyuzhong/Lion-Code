    "lion_code.sidecar",
    "lion_code.session_runtime",
    "lion_code.supervisor",
    "lion_code.tooling",
    "lion_code.tools",
    "lion_code.tui",
    "lion_code.ui",
    "lion_code.usage",
]
ignore_imports = []
allow_indirect_imports = "True"

[[tool.importlinter.contracts]]
name = "Capabilities 不依赖 Agent 宿主与 Application/TUI"
type = "forbidden"
source_modules = ["lion_code.capabilities"]
forbidden_modules = [
    "lion_code.application",
    "lion_code.server",
    "lion_code.sidecar",
    "lion_code.tui",
]
ignore_imports = []
allow_indirect_imports = "False"

[[tool.importlinter.contracts]]
name = "生产代码不导入测试与基准"
type = "forbidden"
source_modules = ["lion_code"]
forbidden_modules = [
    "benchmarks",
    "tests",
]
ignore_imports = []
allow_indirect_imports = "False"
