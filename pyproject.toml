[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lion_code"
version = "1.0.0"
description = "一个用 Python 构建的轻量级编码 Agent"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2.11",
    "rich>=13.0.0",
    "textual>=8.2.8",
    "pygments>=2.18",
    "anyio>=4.0",
    "httpx[socks]>=0.27",
]

[project.optional-dependencies]
benchmark = ["openai>=1.50.0"]

[project.scripts]
lion-code = "lion_code.__main__:main"

[tool.setuptools.packages.find]
include = ["lion_code*"]
