[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lion_code"
version = "1.0.0"
description = "一个用 Python 构建的轻量级编码 Agent"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2.11",
    "rich>=13.0.0",
    "textual>=8.2.8",
    "pygments>=2.18",
    "anyio>=4.0",
    "httpx[socks]>=0.27",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
benchmark = ["openai>=1.50.0"]
benchmark-online = ["deepeval==4.2.0", "opik==2.2.42"]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.0",
    "mypy==2.3.0",
    "coverage==7.15.2",
    "radon==6.0.1",
    "vulture==2.16",
    "import-linter==2.11",
    "pyinstaller==6.16.0",
    "build==1.4.0",
]

[project.scripts]
lion-code = "lion_code.__main__:main"

[tool.setuptools.packages.find]
include = ["lion_code*"]

# ===========================================================================
# 质量基线工具配置（2026-08-01 建立，基线模式）
# 原则：记录基线、执行「不得继续恶化」，不追求立即全绿。
# 每项 ignore 均注明原因；后续精简阶段逐条收紧。
# ===========================================================================

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    "benchmarks/**/results",
    "*.pyc",
]

[tool.ruff.lint]
# 基线模式规则集：E/F 为硬错误，I/RUF/UP 为可自动修复项。
# 说明：BLE001(宽泛 except) 有 99 处，属现有风格，列入 ignore 留待后续阶段；
#       E501(行宽) 大量存在，基线阶段忽略。
select = ["E", "F", "I", "RUF", "UP"]
ignore = [
    "E501",   # 行宽：基线阶段忽略（大量既有违规），后续精简阶段处理
    "E402",   # 模块级 import 非顶部：21 处，多为条件导入，现有风格
    "RUF001", # 混淆字符检测：本项目含大量中文/全角标点，误报重灾区（326 处）
    "RUF002", # 同 RUF001，docstring 混淆字符（393 处）
    "RUF003", # 同 RUF001，注释混淆字符（231 处）
    "RUF100", # 未使用的 noqa：自动修复会改动现有代码，暂留
    "UP042",  # 使用类构造代替 @classmethod：19 处，现有风格
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
platform = "linux"
warn_unused_configs = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true
# 基线模式：CI 以 Python 3.12 + linux 平台为准，本阶段不要求全绿。
# CI 用「错误数不超基线」的比对步骤拦截恶化。

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["lion_code"]
# 覆盖率 7.x：branch 在 run 时启用，report 不再需要 --branch

[tool.coverage.report]
show_missing = true
skip_covered = true
# 基线模式：CI 读取 coverage JSON 做分支覆盖率与 changed-lines 覆盖率门禁。

[tool.radon.cc]
min = "C"
exclude = "tests,benchmarks"

[tool.vulture]
paths = ["lion_code", "tests"]
min_confidence = 70

# ===========================================================================
# import-linter 架构契约
# 原则：契约反映现状，不追求理想架构。CI 拦截「打破现有边界」的回归。
# 用法：lint-imports（自动读 pyproject.toml 的 [tool.importlinter]）
# ===========================================================================
[tool.importlinter]
root_package = "lion_code"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core 不依赖上层运行时包"
type = "forbidden"
source_modules = ["lion_code.core"]
forbidden_modules = [
    "lion_code.adapters",
    "lion_code.application",
    "lion_code.capabilities",
    "lion_code.composition",
    "lion_code.observers",
    "lion_code.permission_state",
    "lion_code.providers",
    "lion_code.runtime",
    "lion_code.server",
    "lion_code.sidecar",
    "lion_code.session_runtime",
    "lion_code.supervisor",
    "lion_code.tooling",
    "lion_code.tui",
    "lion_code.usage",
]
ignore_imports = []
allow_indirect_imports = "False"

[[tool.importlinter.contracts]]
name = "Supervisor 只依赖公开 Core 事件契约"
type = "forbidden"
source_modules = ["lion_code.supervisor"]
forbidden_modules = [
    "lion_code.adapters",
    "lion_code.application",
    "lion_code.capabilities",
    "lion_code.composition",
    "lion_code.context",
    "lion_code.permission_state",
    "lion_code.providers",
    "lion_code.runtime",
    "lion_code.server",
    "lion_code.sidecar",
    "lion_code.session_runtime",
    "lion_code.tooling",
    "lion_code.tui",
    "lion_code.usage",
]
ignore_imports = []
allow_indirect_imports = "False"

[[tool.importlinter.contracts]]
name = "Composition 不依赖 Product Facade 与 Interfaces"
type = "forbidden"
source_modules = ["lion_code.composition"]
forbidden_modules = [
    "lion_code.application",
    "lion_code.meta_agent",
    "lion_code.server",
    "lion_code.sidecar",
    "lion_code.supervisor",
    "lion_code.tui",
]
ignore_imports = ["lion_code.composition.full_product -> lion_code.meta_agent"]
allow_indirect_imports = "True"

[[tool.importlinter.contracts]]
name = "MetaAgent 不依赖 Product Features 与 Interfaces"
type = "forbidden"
source_modules = ["lion_code.meta_agent"]
forbidden_modules = [
    "lion_code.application",
    "lion_code.server",
    "lion_code.sidecar",
    "lion_code.supervisor",
    "lion_code.tui",
]
ignore_imports = []
allow_indirect_imports = "False"

[[tool.importlinter.contracts]]
name = "Providers 只依赖 Core 抽象"
type = "forbidden"
source_modules = ["lion_code.providers"]
forbidden_modules = [
    "lion_code.adapters",
    "lion_code.application",
    "lion_code.capabilities",
    "lion_code.composition",
    "lion_code.config",
    "lion_code.context",
    "lion_code.frontmatter",
    "lion_code.hooks",
    "lion_code.meta_agent",
    "lion_code.observers",
    "lion_code.permission_state",
    "lion_code.project_identity",
    "lion_code.prompt",
    "lion_code.runtime",
    "lion_code.server",
    "lion_code.sidecar",
    "lion_code.session_runtime",
    "lion_code.supervisor",
    "lion_code.tooling",
    "lion_code.tools",
    "lion_code.tui",
    "lion_code.ui",
    "lion_code.usage",
    "lion_code.version",
]
ignore_imports = []
allow_indirect_imports = "False"

[[tool.importlinter.contracts]]
name = "Application 不依赖 TUI"
type = "forbidden"
source_modules = ["lion_code.application"]
forbidden_modules = [
    "lion_code.server",
    "lion_code.sidecar",
    "lion_code.tui",
]
ignore_imports = []
allow_indirect_imports = "False"

[[tool.importlinter.contracts]]
name = "TUI 只经 Application/Core 接触运行时"
type = "forbidden"
source_modules = ["lion_code.tui"]
forbidden_modules = [
    "lion_code.adapters",
    "lion_code.capabilities",
    "lion_code.composition",
    "lion_code.context",
    "lion_code.frontmatter",
    "lion_code.hooks",
    "lion_code.meta_agent",
    "lion_code.observers",
    "lion_code.permission_state",
    "lion_code.project_identity",
    "lion_code.providers",
    "lion_code.runtime",
    "lion_code.server",
    "lion_code.sidecar",
    "lion_code.session_runtime",
    "lion_code.supervisor",
    "lion_code.tooling",
    "lion_code.tools",
    "lion_code.ui",
    "lion_code.usage",
]
ignore_imports = []
# TUI 通过 application.session 间接使用 Agent；只阻止新增的直接引擎 import。
allow_indirect_imports = "True"

[[tool.importlinter.contracts]]
name = "Server 只经 Application/Core 接触运行时"
type = "forbidden"
source_modules = ["lion_code.server"]
forbidden_modules = [
    "lion_code.adapters",
    "lion_code.capabilities",
    "lion_code.composition",
    "lion_code.context",
