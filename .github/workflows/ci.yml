# Lion 质量基线 CI（2026-08-04 收紧）
#
# 质量门禁使用已提交的机器基线，不解析 Ruff/mypy 的人类可读摘要。
# 分支保护仍需在 GitHub 仓库设置中把本 workflow 设为 required check。
#
# 所有质量门禁步骤使用 if: always()，确保任一门禁失败不会阻止
# 后续门禁执行——CI 应一次暴露所有问题，而非在第一个失败处停止。
#
# PR 上 workflow 始终触发（不用 paths 过滤——整 workflow 被 paths 跳过时
# required check 会一直 Pending 阻塞 merge）。changes job 用 git diff 判断
# 变更范围，无关变更时 quality-gates 以 skipped 结束，不阻塞合并。
# desktop job 见独立 workflow desktop.yml。
#
# 不使用 strategy.matrix：分支保护按 job 名要求 check，矩阵会让运行时的
# check 名带版本后缀（Quality gates (baseline) (3.12.13)），而被跳过时
# 只报告裸名，二者不一致导致纯文档/记账类 PR 无法合入。

name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  QUALITY_BASELINE: docs/quality-baseline-2026-08.json
  QUALITY_PATHS: lion_code tests scripts

jobs:
  changes:
    name: 变更范围判断
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.diff.outputs.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 判断 Python 相关变更
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")"
          if echo "$CHANGED" | grep -qE '\.(py|pyi)$|^pyproject\.toml$|^requirements[^/]*\.txt$|^\.github/workflows/ci\.yml$|^docs/quality-baseline-2026-08\.json$'; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi

  quality-gates:
    name: Quality gates (baseline)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.python == 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python 3.12.13
        uses: actions/setup-python@v5
        with:
          python-version: 3.12.13
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      # ---------- 质量门禁命令 ----------
      # 全量测试并入下方 coverage 步骤（coverage run -m pytest），
      # 不再单独跑一次 pytest，避免 975 个测试每个 PR 跑两遍。
      # if: always() 确保每条命令独立执行，不因前序失败而跳过。

      - name: ruff check（JSON 基线比对）
        if: always()
        run: |
          set +e
          python -m ruff check $QUALITY_PATHS --output-format=json > ruff.json
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 1 ]; then
            cat ruff.json
            exit "$STATUS"
          fi
          python scripts/check_quality_baseline.py ruff-check ruff.json --status "$STATUS" --baseline "$QUALITY_BASELINE"

      - name: ruff format --check（基线比对）
        if: always()
        run: |
          set +e
          python -m ruff format --check $QUALITY_PATHS > ruff-format.txt 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 1 ]; then
            cat ruff-format.txt
            exit "$STATUS"
          fi
          python scripts/check_quality_baseline.py ruff-format ruff-format.txt --status "$STATUS" --baseline "$QUALITY_BASELINE"

      - name: python -m compileall -q lion_code tests scripts
        if: always()
        run: python -m compileall -q lion_code tests scripts

      - name: git diff --check
        if: always()
        run: git diff --check

      # ---------- 附加质量门禁 ----------

      - name: mypy 类型检查（JSON 基线比对）
        if: always()
        run: |
          set +e
          python -m mypy lion_code --platform linux -O json > mypy.jsonl 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 1 ]; then
            cat mypy.jsonl
            exit "$STATUS"
          fi
          python scripts/check_quality_baseline.py mypy mypy.jsonl --status "$STATUS" --baseline "$QUALITY_BASELINE"

      - name: import-linter 架构契约
        if: always()
        run: lint-imports --no-cache

      - name: radon D/E/F 复杂度门禁
        if: always()
        run: |
          python -m radon cc lion_code -j > radon-cc.json
          python scripts/check_quality_baseline.py radon-complexity radon-cc.json --baseline "$QUALITY_BASELINE"

      - name: vulture 高置信候选门禁
        if: always()
        run: |
          set +e
          python -m vulture lion_code tests --min-confidence 70 > vulture.txt 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 3 ]; then
            cat vulture.txt
            exit "$STATUS"
          fi
          python scripts/check_quality_baseline.py vulture vulture.txt --status "$STATUS" --baseline "$QUALITY_BASELINE"

      - name: 准备 changed-lines diff
        if: always()
        env:
          BASE_REF: ${{ github.base_ref || 'master' }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF" || true
          git diff --unified=0 "origin/$BASE_REF...HEAD" -- lion_code > changed-lines.diff || true

      - name: 分支覆盖率与 changed-lines 覆盖率门禁
        if: always()
        run: |
          python -m coverage run --branch -m pytest -q -p no:cacheprovider
          python -m coverage json -o coverage.json
          python scripts/check_quality_baseline.py coverage coverage.json --diff-file changed-lines.diff --baseline "$QUALITY_BASELINE"
          python -m coverage report --include="lion_code/*"
