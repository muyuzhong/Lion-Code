name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QUALITY_BASELINE: docs/quality-baseline-2026-08.json
  QUALITY_PATHS: lion_code tests scripts

jobs:
  changes:
    name: 变更范围判断
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.diff.outputs.python }}
      desktop: ${{ steps.diff.outputs.desktop }}
      base: ${{ steps.diff.outputs.base }}
      head: ${{ steps.diff.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 判断变更范围并检查提交差异
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            BASE="$(git merge-base "$PR_BASE" "$PR_HEAD")"
            HEAD="$PR_HEAD"
          else
            BASE="$PUSH_BASE"
            HEAD="$PUSH_HEAD"
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="$(git hash-object -t tree /dev/null)"
            fi
          fi
          git diff --check "$BASE" "$HEAD"
          CHANGED="$(git diff --name-only "$BASE" "$HEAD")"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          if echo "$CHANGED" | grep -qE '\.(py|pyi)$|^pyproject\.toml$|^requirements[^/]*\.txt$|^\.github/workflows/|^docs/quality-baseline-2026-08\.json$'; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -qE '^desktop/|^lion_code/(sidecar|server|application|runtime|context|providers|tooling|adapters|capabilities|composition|core|observers|session_runtime)(/|\.py$)|^lion_code/[^/]+\.py$|^pyproject\.toml$|^requirements[^/]*\.txt$|^\.github/workflows/'; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi

  quality-gates:
    name: Python quality and tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python 3.12.13
        uses: actions/setup-python@v5
        with:
          python-version: 3.12.13
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      # ---------- 质量门禁命令 ----------
      # 全量测试并入下方 coverage 步骤（coverage run -m pytest），
      # 不再单独跑一次 pytest，避免 975 个测试每个 PR 跑两遍。
      # if: always() 确保每条命令独立执行，不因前序失败而跳过。

      - name: ruff check（JSON 基线比对）
        if: always()
        run: |
          set +e
          python -m ruff check $QUALITY_PATHS --output-format=json > ruff.json
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 1 ]; then
            cat ruff.json
            exit "$STATUS"
          fi
          python scripts/check_quality_baseline.py ruff-check ruff.json --status "$STATUS" --baseline "$QUALITY_BASELINE"

      - name: ruff format --check（基线比对）
        if: always()
        run: |
          set +e
          python -m ruff format --check $QUALITY_PATHS > ruff-format.txt 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 1 ]; then
            cat ruff-format.txt
            exit "$STATUS"
          fi
          python scripts/check_quality_baseline.py ruff-format ruff-format.txt --status "$STATUS" --baseline "$QUALITY_BASELINE"

      - name: python -m compileall -q lion_code tests scripts
        if: always()
        run: python -m compileall -q lion_code tests scripts

      # ---------- 附加质量门禁 ----------

      - name: mypy 类型检查（JSON 基线比对）
        if: always()
        run: |
          set +e
          python -m mypy lion_code --platform linux -O json > mypy.jsonl 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 1 ]; then
            cat mypy.jsonl
            exit "$STATUS"
          fi
          python scripts/check_quality_baseline.py mypy mypy.jsonl --status "$STATUS" --baseline "$QUALITY_BASELINE"

      - name: import-linter 架构契约
        if: always()
        run: lint-imports --no-cache

      - name: radon D/E/F 复杂度报告
        continue-on-error: true
        if: always()
        run: |
          python -m radon cc lion_code -j > radon-cc.json
          python scripts/check_quality_baseline.py radon-complexity radon-cc.json --baseline "$QUALITY_BASELINE"

      - name: vulture 高置信候选报告
        continue-on-error: true
        if: always()
        run: |
          set +e
          python -m vulture lion_code tests --min-confidence 70 > vulture.txt 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 3 ]; then
            cat vulture.txt
            exit "$STATUS"
          fi
          python scripts/check_quality_baseline.py vulture vulture.txt --status "$STATUS" --baseline "$QUALITY_BASELINE"

      - name: 准备 changed-lines diff
        if: always()
        env:
          BASE_SHA: ${{ needs.changes.outputs.base }}
          HEAD_SHA: ${{ needs.changes.outputs.head }}
        run: git diff --unified=0 "$BASE_SHA" "$HEAD_SHA" -- lion_code > changed-lines.diff

      - name: 分支覆盖率与 changed-lines 覆盖率门禁
        if: always()
        run: |
          python -m coverage run --branch -m pytest -q -p no:cacheprovider
          python -m coverage json -o coverage.json
          python scripts/check_quality_baseline.py coverage coverage.json --diff-file changed-lines.diff --baseline "$QUALITY_BASELINE"
          python -m coverage report --include="lion_code/*"

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    uses: ./.github/workflows/desktop.yml

  required:
    name: Quality gates (baseline)
    runs-on: ubuntu-latest
    needs: [changes, quality-gates, desktop]
    if: always()
    steps:
      - name: 汇总必需检查
        env:
          CHANGES: ${{ needs.changes.result }}
          PYTHON_REQUIRED: ${{ needs.changes.outputs.python }}
          DESKTOP_REQUIRED: ${{ needs.changes.outputs.desktop }}
          PYTHON_RESULT: ${{ needs.quality-gates.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
        run: |
          test "$CHANGES" = "success"
          if [ "$PYTHON_REQUIRED" = "true" ]; then
            test "$PYTHON_RESULT" = "success"
          else
            test "$PYTHON_REQUIRED" = "false"
            test "$PYTHON_RESULT" = "skipped"
          fi
          if [ "$DESKTOP_REQUIRED" = "true" ]; then
            test "$DESKTOP_RESULT" = "success"
          else
            test "$DESKTOP_REQUIRED" = "false"
            test "$DESKTOP_RESULT" = "skipped"
          fi
