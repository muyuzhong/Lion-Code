# Lion 桌面端 CI
#
# PR 上 workflow 始终触发（不用 paths 过滤——整 workflow 被 paths 跳过时
# required check 会一直 Pending 阻塞 merge）。changes job 用 git diff
# 判断是否涉及 desktop / sidecar 依赖，无关变更时 desktop-windows 以
# skipped 结束，不阻塞合并。
#
# NSIS 打包、安装态烟测、上传安装包仅在 push（master）时执行，PR 只做
# 单测、typecheck、build 与 E2E。

name: Desktop CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  changes:
    name: 变更范围判断
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.diff.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 判断 desktop 相关变更
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")"
          if echo "$CHANGED" | grep -qE '^desktop/|^pyproject\.toml$|^requirements[^/]*\.txt$|^\.github/workflows/desktop\.yml$'; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi

  desktop-windows:
    name: Desktop Windows x64
    runs-on: windows-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.desktop == 'true'
    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip

      - name: 设置 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 安装 Python 与桌面依赖
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
          npm --prefix desktop ci

      - name: 桌面单测、类型与构建
        run: |
          npm --prefix desktop test
          npm --prefix desktop run typecheck
          npm --prefix desktop run build

      - name: Electron 主链路 E2E
        working-directory: desktop
        run: npx playwright test --workers=1

      - name: Windows x64 NSIS 打包
        if: github.event_name == 'push'
        run: npm --prefix desktop run package:win

      - name: 安装态 sidecar 生命周期烟测
        if: github.event_name == 'push'
        env:
          LION_PACKAGED_APP: ${{ github.workspace }}\desktop\release\win-unpacked\Lion.exe
        run: npm --prefix desktop run test:packaged

      - name: 上传安装包
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: lion-desktop-windows-x64
          path: desktop/release/Lion-*-x64.exe
          if-no-files-found: error
